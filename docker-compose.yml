services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes: ["./backend:/app"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [backend]
